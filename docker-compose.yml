# Insight — local development / discovery environment.
#
# CURRENT STATE (Phase 1): only the test MQTT broker is real and usable.
# `backend`, `frontend` and `postgres` services are commented out because
# those components do not exist yet (see docs/ROADMAP.md) — an empty build
# context would fail or silently do nothing, which is worse than omitting
# it. Uncomment and wire them up as each phase lands.
#
# SQL Server support (spec section 16) is intentionally NOT modeled here:
# it is expected to point at the client's existing DWH/ERP instance, not a
# container this project owns.

services:
  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: insight-mqtt-broker
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

